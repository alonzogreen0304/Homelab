<style>
/* Layout: one amber CRT terminal, status rail on top, prompt + answer keys below. Single deliberate dark look. */
:root {
  --bg: #0f0b06;
  --screen: #17110a;
  --line: #3a2a14;
  --amber: #ffb02e;
  --amber-dim: #b07a24;
  --amber-faint: #5c4118;
  --hot: #ff5a3c;
  --g: 255, 176, 46;
  --cool: #9fe0a0;
  --display: "VT323", "Courier New", monospace;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  color-scheme: dark;
}
[data-skin="green"] { --bg: #060d08; --screen: #0b150e; --line: #1d3a24; --amber: #5dff8a; --amber-dim: #3aa85a; --amber-faint: #1f5a30; --cool: #d9ffe3; --g: 93, 255, 138; }
[data-skin="purple"] { --bg: #0c0815; --screen: #140e22; --line: #33264f; --amber: #c89bff; --amber-dim: #8a68c4; --amber-faint: #4a3870; --g: 200, 155, 255; }
[data-skin="cyan"] { --bg: #050c10; --screen: #0a161c; --line: #173640; --amber: #5fe3ff; --amber-dim: #3a98ad; --amber-faint: #1e4f5c; --g: 95, 227, 255; }
[data-skin="red"] { --bg: #120607; --screen: #1a0b0c; --line: #45191b; --amber: #ff6b6b; --amber-dim: #b24a4a; --amber-faint: #5e2425; --hot: #ffd23f; --g: 255, 107, 107; }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: 0; border: 1px solid rgba(255,255,255,0.25); }
.chip[aria-pressed="true"] .swatch { border: 2px solid var(--bg); }
.mode-note { margin-top: 8px; font-size: 13px; color: var(--amber-dim); max-width: 62ch; border-left: 2px solid var(--amber-faint); padding-left: 10px; }
.mode-note b { color: var(--amber); font-weight: 500; }
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg);
  color: var(--amber);
  font-family: var(--mono);
  font-size: 15px;
  line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 32px;
}
.crt {
  position: relative;
  max-width: 760px;
  margin: 0 auto;
  background: var(--screen);
  border: 2px solid var(--line);
  border-radius: 14px;
  padding: 20px clamp(14px, 4vw, 28px) 24px;
  overflow: hidden;
  box-shadow: inset 0 0 80px rgba(var(--g), 0.06);
}
.crt::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,0.22) 0 1px, transparent 1px 3px);
}
.glow { text-shadow: 0 0 6px rgba(var(--g), 0.45); }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 16px; border-bottom: 1px dashed var(--line); padding-bottom: 10px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(34px, 8vw, 46px); line-height: 1; margin: 0; letter-spacing: 0.04em; }
.sub { color: var(--amber-dim); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; }
.rail { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin: 14px 0 6px; }
.stat { border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; min-width: 0; }
.stat b { display: block; font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { font-size: 10.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--amber-dim); }
.pips { display: flex; gap: 6px; margin-top: 6px; }
.pip { width: 14px; height: 14px; border: 1px solid var(--amber-dim); border-radius: 2px; }
.pip.on { background: var(--hot); border-color: var(--hot); box-shadow: 0 0 8px var(--hot); }
.layers { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin: 10px 0 4px; }
.layer { height: 10px; border: 1px solid var(--amber-faint); border-radius: 2px; }
.layer.done { background: var(--amber); border-color: var(--amber); }
.layer.fail { background: var(--hot); border-color: var(--hot); }
.layer-label { font-size: 11px; color: var(--amber-dim); letter-spacing: 0.08em; text-transform: uppercase; }
.term { margin-top: 16px; min-height: 92px; }
.log { color: var(--amber-dim); font-size: 13px; white-space: pre-wrap; word-break: break-word; }
.prompt { font-family: var(--display); font-size: clamp(30px, 9vw, 54px); line-height: 1.05; margin: 8px 0 2px; word-break: break-word; }
.question { color: var(--amber-dim); font-size: 14px; }
.cursor { display: inline-block; width: 0.55em; height: 0.9em; background: var(--amber); vertical-align: -0.08em; margin-left: 4px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.timer { height: 4px; background: var(--amber-faint); border-radius: 2px; margin: 14px 0 12px; overflow: hidden; }
.timer i { display: block; height: 100%; width: 100%; background: var(--amber); transform-origin: left; }
.timer.low i { background: var(--hot); }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .opts { grid-template-columns: 1fr; } .rail { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
button { font: inherit; color: inherit; cursor: pointer; }
.opt {
  text-align: left; background: transparent; border: 1px solid var(--amber-faint); border-radius: 8px;
  padding: 12px 14px; display: flex; gap: 10px; align-items: flex-start; min-width: 0;
  transition: border-color 0.15s, background 0.15s;
}
.opt:hover:not(:disabled), .opt:focus-visible { border-color: var(--amber); background: rgba(var(--g),0.07); outline: none; }
.opt .k { color: var(--amber-dim); font-size: 12px; padding-top: 2px; flex: none; }
.opt .t { min-width: 0; word-break: break-word; }
.opt.right { border-color: var(--cool); color: var(--cool); background: rgba(159,224,160,0.08); }
.opt.wrong { border-color: var(--hot); color: var(--hot); background: rgba(255,90,60,0.08); }
.opt:disabled { cursor: default; }
.feedback { margin-top: 14px; border-left: 3px solid var(--amber-faint); padding: 6px 0 6px 12px; min-height: 52px; }
.feedback.ok { border-color: var(--cool); }
.feedback.bad { border-color: var(--hot); }
.feedback .head { font-weight: 600; }
.feedback.ok .head { color: var(--cool); }
.feedback.bad .head { color: var(--hot); }
.feedback .mean { color: var(--amber-dim); font-size: 13.5px; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 16px; }
.btn {
  background: var(--amber); color: var(--bg); border: 0; border-radius: 6px; padding: 10px 18px;
  font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; font-size: 13px;
}
.btn:focus-visible { outline: 2px solid var(--cool); outline-offset: 2px; }
.btn.ghost { background: transparent; color: var(--amber); border: 1px solid var(--amber-dim); }
.exit { padding: 6px 12px; font-size: 11.5px; margin-left: auto; }
.exit.armed { border-color: var(--hot); color: var(--hot); }
.hint { font-size: 11.5px; color: var(--amber-dim); }
.label { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--amber-dim); margin: 18px 0 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: transparent; border: 1px solid var(--amber-faint); border-radius: 999px; padding: 5px 12px; font-size: 12.5px; }
.chip[aria-pressed="true"] { background: var(--amber); color: var(--bg); border-color: var(--amber); }
.chip:focus-visible { outline: 2px solid var(--cool); outline-offset: 2px; }
.intro p { margin: 10px 0; max-width: 62ch; }
.intro .demo { font-family: var(--display); font-size: 26px; margin-top: 12px; }
.result h2 { font-family: var(--display); font-weight: 400; font-size: clamp(36px, 9vw, 56px); line-height: 1; margin: 6px 0 4px; }
.result h2.lose { color: var(--hot); }
.result h2.win { color: var(--cool); }
.missed { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 8px; }
.missed li { border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; }
.missed b { font-family: var(--display); font-weight: 400; font-size: 22px; margin-right: 8px; }
.missed small { display: block; color: var(--amber-dim); }
footer { max-width: 760px; margin: 12px auto 0; font-size: 11.5px; color: var(--amber-faint); text-align: center; }
.shake { animation: shake 0.35s; }
@keyframes shake { 20%,60% { transform: translateX(-6px); } 40%,80% { transform: translateX(6px); } }
@media (prefers-reduced-motion: reduce) { .cursor, .shake { animation: none; } }
.viz { display: flex; flex-direction: column; align-items: stretch; margin: 12px 0 6px; }
.viz .node { border: 1px solid var(--amber-dim); border-radius: 6px; padding: 6px 10px; text-align: center; font-size: 13px; color: var(--amber); background: rgba(var(--g),0.04); animation: lit 0.5s both; animation-delay: calc(var(--d) * 0.45s); min-width: 0; word-break: break-word; }
.viz .edge { text-align: center; color: var(--amber-dim); font-size: 11.5px; padding: 3px 4px; animation: lit 0.5s both; animation-delay: calc(var(--d) * 0.45s + 0.22s); min-width: 0; }
.viz .edge::before { content: "\2193  "; color: var(--amber); }
.viz.seq .edge::before { content: "\2193"; }
@media (min-width: 640px) {
  .viz { flex-direction: row; align-items: center; }
  .viz .node { flex: 1 1 0; }
  .viz .edge { flex: 0 1 auto; max-width: 120px; }
  .viz .edge::before, .viz.seq .edge::before { content: "\2192  "; }
}
@keyframes lit { from { opacity: 0.2; } to { opacity: 1; box-shadow: 0 0 10px rgba(var(--g),0.25); } }
.viz-label { font-size: 10.5px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--amber-dim); margin-top: 12px; }
.ex { font-size: 13px; color: var(--amber); margin-top: 4px; }
.ex b { color: var(--amber-dim); font-weight: 500; }
@media (display-mode: standalone) { body { padding-top: calc(20px + env(safe-area-inset-top, 0px)); } }
@media (prefers-reduced-motion: reduce) { .viz .node, .viz .edge { animation: none; } }
</style>

.", 0, "The Pi-hole API key your Homepage widget uses for stats."], ["CI/CD", "Continuous Integration / Continuous Delivery", "Automatically testing and shipping code changes.", "Cloud & Modern IT", ["git push", "CI: build + test", "Pipeline", "CD: deploy", "Production"], "Add security scans to the pipeline.", 0, "GitHub Actions testing and deploying code on every push."], ["SDLC", "Software Development Life Cycle", "The stages of building software, from planning to retirement.", "Cloud & Modern IT", ["Plan", "Design", "Build", "Test", "Deploy + maintain"], "Security belongs in every phase.", 1, "Plan, design, build, test, deploy, maintain."], ["SBOM", "Software Bill of Materials", "A list of every component inside a piece of software.", "Cloud & Modern IT", ["Software", "contains", "SBOM list", "flags", "Vulnerable library"], "Find Log4j fast when it hits the news.", 0, "A list of every library inside an app, like an ingredients label."]];
const ROUNDS = 10, LIVES = 3, TIME = 15;
const CATS = [...new Set(DATA.map(d => d[3]))];
const app = document.getElementById('app');
const crt = document.getElementById('crt');
const exitBtn = document.getElementById('exit');
let exitArm = null;
function showExit(on) { exitBtn.hidden = !on; disarmExit(); }
function disarmExit() { clearTimeout(exitArm); exitArm = null; exitBtn.classList.remove('armed'); exitBtn.textContent = 'Exit'; }
function exitGame() {
  if (exitBtn.hidden) return;
  if (!exitArm) {
    exitBtn.classList.add('armed'); exitBtn.textContent = 'Tap again to exit';
    exitArm = setTimeout(disarmExit, 3000);
    return;
  }
  g = null; showExit(false); intro();
}
exitBtn.onclick = exitGame;

const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

let settings = Object.assign({ mode: 'a2m', cats: [], skin: 'amber' }, store.get('ab-settings', {}));
const SKINS = [['amber', 'Amber', '#ffb02e'], ['green', 'Matrix green', '#5dff8a'], ['purple', 'Dungeon purple', '#c89bff'], ['cyan', 'Ice blue', '#5fe3ff'], ['red', 'Red team', '#ff6b6b']];
const MODES = {
  a2m: '<b>Acronym → meaning:</b> you see the acronym (like SIEM) and pick what it stands for. Best for learning what each one means.',
  m2a: '<b>Meaning → acronym:</b> you see the full name (like Security Information and Event Management) and pick the acronym. Closer to how Security+ questions describe things, so it\'s harder.'
};
function applySkin() { document.documentElement.dataset.skin = settings.skin; }
applySkin();
let best = store.get('ab-best', 0);
let g = null, timerId = null, typeId = null;

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function pool() {
  return settings.cats.length ? DATA.filter(d => settings.cats.includes(d[3])) : DATA;
}

function intro() {
  clearTimers();
  showExit(false);
  const sel = settings.cats;
  app.innerHTML = `
    <div class="intro">
      <div class="log">&gt; connection established
&gt; target: training node · ${DATA.length} acronyms loaded</div>
      <div class="demo glow">&gt; decrypt SIEM<span class="cursor"></span></div>
      <p>Crack ${ROUNDS} firewall layers by decoding acronyms. Each correct answer breaks a layer. Streaks multiply your score. Every wrong answer or timeout raises your trace level, and ${LIVES} traces gets you caught.</p>
      <div class="label">Mode</div>
      <div class="chips" role="group" aria-label="Mode">
        <button class="chip" id="mode-a2m" aria-pressed="${settings.mode === 'a2m'}">Acronym → meaning</button>
        <button class="chip" id="mode-m2a" aria-pressed="${settings.mode === 'm2a'}">Meaning → acronym</button>
      </div>
      <div class="mode-note">${MODES[settings.mode]}</div>
      <div class="label">Categories <span class="hint">(none picked = all)</span></div>
      <div class="chips" role="group" aria-label="Categories">
        ${CATS.map((c, i) => `<button class="chip" id="cat-${i}" data-cat="${esc(c)}" aria-pressed="${sel.includes(c)}">${esc(c)}</button>`).join('')}
      </div>
      <div class="label">Color theme</div>
      <div class="chips" role="group" aria-label="Color theme">
        ${SKINS.map(s => `<button class="chip" id="skin-${s[0]}" data-skin-pick="${s[0]}" aria-pressed="${settings.skin === s[0]}"><span class="swatch" style="background:${s[2]}"></span>${s[1]}</button>`).join('')}
      </div>
      <div class="row">
        <button class="btn" id="start">Start breach</button>
        <span class="hint">Best score: <b>${best}</b> · Keys 1–4 to answer, Enter for next, Esc to exit</span>
      </div>
    </div>`;
  document.getElementById('mode-a2m').onclick = () => { settings.mode = 'a2m'; store.set('ab-settings', settings); intro(); };
  document.getElementById('mode-m2a').onclick = () => { settings.mode = 'm2a'; store.set('ab-settings', settings); intro(); };
  app.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => {
    const c = b.dataset.cat;
    settings.cats = settings.cats.includes(c) ? settings.cats.filter(x => x !== c) : [...settings.cats, c];
    if (pool().length < 4) settings.cats = [];
    store.set('ab-settings', settings); intro();
  });
  app.querySelectorAll('[data-skin-pick]').forEach(b => b.onclick = () => { settings.skin = b.dataset.skinPick; store.set('ab-settings', settings); applySkin(); intro(); });
  document.getElementById('start').onclick = start;
}

function start() {
  const p = shuffle(pool());
  g = { qs: p.slice(0, ROUNDS), i: 0, score: 0, streak: 0, traces: 0, layers: [], missed: [], correct: 0, answered: false };
  question();
}

function makeOptions(item) {
  const same = shuffle(DATA.filter(d => d !== item && d[3] === item[3]));
  const other = shuffle(DATA.filter(d => d !== item && d[3] !== item[3]));
  const picks = [...same, ...other].slice(0, 3);
  return shuffle([item, ...picks]);
}

function vizHTML(item) {
  const f = item[4], seq = item[6];
  let out = `<div class="viz-label">How it works</div><div class="viz${seq ? ' seq' : ''}">`;
  f.forEach((x, i) => {
    if (seq) { if (i) out += `<div class="edge" style="--d:${i - 1}"></div>`; out += `<div class="node" style="--d:${i}">${esc(x)}</div>`; }
    else if (i % 2 === 0) out += `<div class="node" style="--d:${i / 2}">${esc(x)}</div>`;
    else out += `<div class="edge" style="--d:${(i - 1) / 2}">${esc(x)}</div>`;
  });
  return out + `</div><div class="ex"><b>Real world:</b> ${esc(item[5])}</div>`;
}

function railHTML() {
  const pips = Array.from({ length: LIVES }, (_, i) => `<div class="pip ${i < g.traces ? 'on' : ''}"></div>`).join('');
  return `<div class="rail">
      <div class="stat"><b class="glow">${g.score}</b><span>Score</span></div>
      <div class="stat"><b>x${mult()}</b><span>Streak ${g.streak}</span></div>
      <div class="stat"><b>${Math.min(g.i + 1, ROUNDS)}/${ROUNDS}</b><span>Layer</span></div>
      <div class="stat"><span>Trace</span><div class="pips">${pips}</div></div>
    </div>`;
}

function layersHTML() {
  return `<div class="layers">${Array.from({ length: ROUNDS }, (_, i) => `<div class="layer ${g.layers[i] === 1 ? 'done' : g.layers[i] === 0 ? 'fail' : ''}"></div>`).join('')}</div>`;
}

function statusHTML() {
  return railHTML() + '<div class="layer-label">Firewall layers</div>' + layersHTML();
}

function mult() { return 1 + Math.floor(g.streak / 3); }

function question() {
  clearTimers();
  showExit(true);
  g.answered = false;
  const item = g.qs[g.i];
  g.opts = makeOptions(item);
  const a2m = settings.mode === 'a2m';
  const promptText = a2m ? `decrypt ${item[0]}` : `match "${item[1]}"`;
  const qText = a2m ? `What does ${item[0]} stand for?` : `Which acronym is this?`;
  app.innerHTML = `
    ${statusHTML()}
    <div class="term">
      <div class="log">&gt; layer ${g.i + 1} · ${esc(item[3])}</div>
      <div class="prompt glow" id="prompt">&gt; <span id="typed"></span><span class="cursor"></span></div>
      <div class="question">${esc(qText)}</div>
    </div>
    <div class="timer" id="timer"><i id="bar"></i></div>
    <div class="opts">
      ${g.opts.map((o, k) => `<button class="opt" id="opt-${k}" data-k="${k}"><span class="k">[${k + 1}]</span><span class="t">${esc(a2m ? o[1] : o[0])}</span></button>`).join('')}
    </div>
    <div class="feedback" id="fb"><span class="hint">Pick an answer before the timer runs out.</span></div>`;
  const typed = document.getElementById('typed');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) typed.textContent = promptText;
  else { let n = 0; typeId = setInterval(() => { typed.textContent = promptText.slice(0, ++n); if (n >= promptText.length) clearInterval(typeId); }, 28); }
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(+b.dataset.k));
  const bar = document.getElementById('bar'), tbox = document.getElementById('timer');
  const t0 = performance.now();
  timerId = setInterval(() => {
    const left = Math.max(0, TIME - (performance.now() - t0) / 1000);
    bar.style.transform = `scaleX(${left / TIME})`;
    tbox.classList.toggle('low', left < 5);
    if (left <= 0) answer(-1);
  }, 100);
  g.t0 = t0;
}

function answer(k) {
  if (g.answered) return;
  g.answered = true;
  clearTimers();
  const item = g.qs[g.i];
  const rightK = g.opts.indexOf(item);
  const ok = k === rightK;
  const secsLeft = Math.max(0, TIME - (performance.now() - g.t0) / 1000);
  app.querySelectorAll('.opt').forEach(b => { b.disabled = true; });
  document.getElementById('opt-' + rightK).classList.add('right');
  if (k >= 0 && !ok) document.getElementById('opt-' + k).classList.add('wrong');
  const fb = document.getElementById('fb');
  if (ok) {
    g.streak++; g.correct++;
    const pts = (100 + Math.round(secsLeft * 10)) * mult();
    g.score += pts; g.layers[g.i] = 1;
    fb.className = 'feedback ok';
    fb.innerHTML = `<div class="head">ACCESS GRANTED +${pts}</div><div class="mean"><b>${esc(item[0])}</b> = ${esc(item[1])}. ${esc(item[2])}</div><div class="ex"><b>Example:</b> ${esc(item[7] || '')}</div>${vizHTML(item)}`;
  } else {
    g.streak = 0; g.traces++; g.layers[g.i] = 0; g.missed.push(item);
    fb.className = 'feedback bad';
    fb.innerHTML = `<div class="head">${k < 0 ? 'TIMEOUT' : 'ACCESS DENIED'} · trace ${g.traces}/${LIVES}</div><div class="mean"><b>${esc(item[0])}</b> = ${esc(item[1])}. ${esc(item[2])}</div><div class="ex"><b>Example:</b> ${esc(item[7] || '')}</div>${vizHTML(item)}`;
    crt.classList.remove('shake'); void crt.offsetWidth; crt.classList.add('shake');
  }
  const last = g.traces >= LIVES || g.i + 1 >= ROUNDS;
  app.querySelector('.rail').outerHTML = railHTML();
  app.querySelector('.layers').outerHTML = layersHTML();
  fb.insertAdjacentHTML('afterend', `<div class="row"><button class="btn" id="next">${last ? 'See results' : 'Next layer'}</button><span class="hint">or press Enter</span></div>`);
  const next = document.getElementById('next');
  next.onclick = () => { if (last) result(); else { g.i++; question(); } };
  next.focus();
}

function result() {
  clearTimers();
  showExit(false);
  const caught = g.traces >= LIVES;
  const answered = g.layers.filter(x => x !== undefined).length;
  const acc = answered ? Math.round(g.correct / answered * 100) : 0;
  const newBest = g.score > best;
  if (newBest) { best = g.score; store.set('ab-best', best); }
  app.innerHTML = `
    ${statusHTML()}
    <div class="result">
      <div class="log">&gt; session ${caught ? 'terminated' : 'complete'}</div>
      <h2 class="${caught ? 'lose' : 'win'} glow">${caught ? 'TRACED. YOU GOT CAUGHT.' : 'NODE BREACHED.'}</h2>
      <div>Score <b>${g.score}</b> · Accuracy <b>${acc}%</b> (${g.correct}/${answered}) · Best <b>${best}</b>${newBest ? ' · new best' : ''}</div>
      ${g.missed.length ? `<div class="label">Review these</div><ul class="missed">${g.missed.map(m => `<li><b>${esc(m[0])}</b>${esc(m[1])}<small>${esc(m[2])} <i>e.g. ${esc(m[7] || '')}</i></small></li>`).join('')}</ul>` : `<p>Clean run. No misses.</p>`}
      <div class="row">
        <button class="btn" id="again">Run it back</button>
        <button class="btn ghost" id="menu">Change settings</button>
      </div>
    </div>`;
  document.getElementById('again').onclick = start;
  document.getElementById('menu').onclick = intro;
  document.getElementById('again').focus();
}

function clearTimers() { clearInterval(timerId); clearInterval(typeId); }

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { exitGame(); return; }
  if (!g || e.metaKey || e.ctrlKey || e.altKey) return;
  if (!g.answered && /^[1-4]$/.test(e.key) && document.getElementById('opt-0')) { answer(+e.key - 1); }
});

intro();
</script>
</body>
</html>
