<style>
/* Brain Vault template · github.com/alonzogreen0304/homelab/tree/main/brain-vault
   Layout: a single-screen "vault" — a rotating 3D brain on the left (top on phones), the selected lobe's class file on the right (below on phones). Deliberately one dark theme: it's a lab instrument. */
:root {
  color-scheme: dark;
  --bg: #07060f;
  --panel: #110f22;
  --panel2: #18152f;
  --line: #2a2550;
  --ink: #eeebff;
  --muted: #a49fcc;
  --faint: #6b6699;
  --good: #4ade80;
  --warn: #fbbf24;
  --bad: #f87171;
  --display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --body: "Figtree", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --c: #a78bfa;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 24px;
}
.app { max-width: 1180px; margin: 0 auto; display: grid; gap: 14px; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); align-items: start; }
.app > * { min-width: 0; }
header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 8px 16px; }
h1 { margin: 0; font: 700 clamp(26px, 5vw, 38px)/1 var(--display); letter-spacing: 1px; text-transform: uppercase; }
h1 span { color: var(--muted); font-weight: 500; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.asof { font: 600 11px var(--mono); color: var(--faint); letter-spacing: 1px; text-transform: uppercase; }

.stage { position: relative; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; height: 520px;
  background: radial-gradient(ellipse at 50% 45%, #1a1440 0%, #0b0a1c 55%, var(--bg) 100%); }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#gl.hovering { cursor: pointer; }
.tip { position: absolute; pointer-events: none; padding: 4px 9px; border-radius: 6px; font: 600 12px var(--mono); background: #000c; border: 1px solid var(--c); color: var(--ink); transform: translate(12px, -28px); white-space: nowrap; }
.hint { position: absolute; left: 12px; bottom: 10px; font: 11px var(--mono); color: var(--faint); letter-spacing: .5px; }
.fallback { position: absolute; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--muted); }

.legend { grid-column: 1; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.chip { display: flex; align-items: center; gap: 8px; text-align: left; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; font: 500 13px var(--body); min-width: 0; }
.chip i { width: 12px; height: 12px; border-radius: 50%; flex: none; background: var(--c); box-shadow: 0 0 10px var(--c); }
.chip span { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip small { display: block; color: var(--faint); font: 11px var(--mono); }
.chip[aria-pressed="true"] { border-color: var(--c); background: var(--panel2); }
.chip:focus-visible, button:focus-visible { outline: 2px solid var(--c); outline-offset: 2px; }

.file { grid-column: 2; grid-row: 2 / span 2; border: 1px solid var(--line); border-top: 4px solid var(--c); border-radius: 18px; background: var(--panel); padding: 18px; display: grid; gap: 14px; align-content: start; overflow: auto; max-height: 660px; }
.lobe { font: 600 11px var(--mono); color: var(--c); letter-spacing: 1.5px; text-transform: uppercase; }

.meta { color: var(--muted); font-size: 13.5px; margin: 4px 0 0; }
.why { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--panel2); font-size: 13.5px; color: var(--muted); }
.why b { color: var(--c); font-weight: 600; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { background: var(--panel2); border-radius: 10px; padding: 9px 10px; min-width: 0; }

.qbar { height: 4px; border-radius: 99px; background: var(--panel2); overflow: hidden; margin: 6px 0 10px; }
.qbar i { display: block; height: 100%; background: var(--c); }
.qq { font: 600 17px/1.4 var(--body); margin: 0 0 10px; }
.qopts { display: grid; gap: 8px; }
.qopt { text-align: left; font: 500 14.5px var(--body); color: var(--ink); background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.qopt:hover:not(:disabled) { border-color: var(--c); }

.lch { font: 600 11px var(--mono); color: var(--faint); white-space: nowrap; }

.lwhy { margin: 0; font-size: 13.5px; color: var(--muted); }

function renderCards(k, box, st) {
  const [t, d, src] = st.items[st.order[st.n]];
  box.innerHTML = `<div class="qmeta"><span><button class="back" id="qback">‹ Quizzes</button> ${esc(st.title)}</span><span>Card ${st.n + 1} of ${st.items.length}</span></div>

    <button class="fcard${st.flipped ? " flip" : ""}" id="fcard"><small>${st.flipped ? "Definition" : "Term"} · tap to flip</small><b>${esc(st.flipped ? d : t)}</b><em>${esc(src)}</em></button>
    <div class="row frow"><button class="ghost" id="fprev"${st.n === 0 ? " disabled" : ""}>‹ Prev</button><button class="ghost" id="fshuf">Shuffle</button><button class="go" id="fnext">${st.n === st.items.length - 1 ? "Done" : "Next ›"}</button></div>`;
  $("qback").onclick = () => { qState = null; renderQuiz(k); };

  $("fprev").onclick = () => { st.n--; st.flipped = false; renderQuiz(k); };

function renderQuiz(k) {
  clearInterval(timer);
  const box = $("quizbox"); if (!box) return;
  if (!qState || qState.k !== k) { qState = null; renderPicker(k, box); return; }
  const st = qState, qs = st.items, exam = st.mode === "exam";
  if (st.mode === "cards") { renderCards(k, box, st); return; }
  if (st.n >= qs.length) {
    const best = Math.max(getBest(st.id), st.score); if (!st.noBest) setBest(st.id, best);
    const pct = Math.round(st.score / qs.length * 100), used = fmt(Date.now() - st.start);
    box.innerHTML = `<div class="qstart"><p class="best">${esc(st.title)}</p><div class="big">${st.score}/${qs.length}</div>
      <p>${st.timedOut ? "Time ran out. Unanswered questions count as wrong. " : ""}${exam ? `${pct}% · time used ${used}. ` : ""}${pct >= 90 ? "Locked in. You know this." : pct >= 70 ? "Solid. Review the ones you missed." : "Go back through the study guide, then try again."}</p>
      ${st.missed.length ? `<h3>Review these · added to weak spots</h3><div class="guide">${st.missed.map(i => `<div class="term"><b>${esc(qs[i][0])}</b><p>${esc(qs[i][1][0])}</p><p class="an">${esc(qs[i][2])}</p><p class="src">${esc(qs[i][3])}</p></div>`).join("")}</div>` : ""}
      ${st.noBest ? "" : `<p class="best">Best: ${best}/${qs.length}</p>`}<div class="row"><button class="go" id="qagain">${st.spec === "weak" ? "Drill again" : "Retake"}</button><button class="ghost" id="qback">All quizzes</button></div></div>`;
    $("qagain").onclick = () => startSet(k, st.spec);
    $("qback").onclick = () => { qState = null; renderQuiz(k); };
    return;
  }
  const [q, opts, why, src, qk] = qs[st.order[st.n]];
  const shown = shuffle(opts.map((t, i) => ({ t, ok: i === 0 })));
  box.innerHTML = `<div class="qmeta"><span><button class="back" id="qback">‹ Quizzes</button> ${esc(st.title)}</span>${exam ? `<span class="timer" id="qtimer">${fmt(st.endAt - Date.now())}</span>` : `<span id="qscore">Score ${st.score}</span>`}</div>
    <div class="qbar"><i style="width:${st.n / qs.length * 100}%"></i></div>
    <p class="qmeta"><span>Question ${st.n + 1} of ${qs.length}</span>${st.mixed ? `<span>${esc(src)}</span>` : ""}</p>
    <p class="qq">${esc(q)}</p>
    <div class="qopts">${shown.map((o, i) => `<button class="qopt" id="qopt${i}" data-ok="${o.ok}">${esc(o.t)}</button>`).join("")}</div>
    <div id="qafter"></div>`;
  $("qback").onclick = () => { qState = null; renderQuiz(k); };
  if (exam) timer = setInterval(() => {
    if (qState !== st) { clearInterval(timer); return; }
    const left = st.endAt - Date.now();
    if (left <= 0) { for (let i = st.n; i < qs.length; i++) { st.missed.push(st.order[i]); markMiss(qs[st.order[i]][4], qs[st.order[i]][0], false); } st.n = qs.length; st.timedOut = true; renderQuiz(k); }
    else { const el = $("qtimer"); if (el) { el.textContent = fmt(left); el.classList.toggle("low", left < 60000); } }
  }, 1000);
  box.querySelectorAll(".qopt").forEach(b => b.addEventListener("click", () => {
    const ok = b.dataset.ok === "true";
    markMiss(qk, q, ok);
    if (ok) st.score++; else st.missed.push(st.order[st.n]);
    if (exam) { st.n++; renderQuiz(k); return; }
    box.querySelectorAll(".qopt").forEach(x => { x.disabled = true; if (x.dataset.ok === "true") x.classList.add("right"); });
    if (ok) $("qscore").textContent = "Score " + st.score; else b.classList.add("wrong");
    $("qafter").innerHTML = `<p class="qwhy"><b>${ok ? "Correct." : "Not quite."}</b> ${esc(why)}${ok ? "" : " <em class='wtag'>Added to weak spots.</em>"}</p><button class="go" id="qnext">${st.n === qs.length - 1 ? "See score" : "Next question"}</button>`;
    $("qnext").onclick = () => { st.n++; renderQuiz(k); };
    $("qnext").focus();
  }));
}

// ---------- 3D brain (drawn on a plain canvas, no outside library) ----------
(function () {
  const stage = $("stage"), canvas = $("gl");

  const RI = s => SLOT[s] === undefined ? NONE : SLOT[s];
  for (let i = 0; i < 3000; i++) {
    const [dx, dy, dz] = sphereDir();
    const side = dx >= 0 ? 1 : -1;
    const g = gyri(dx, dy, dz) * (0.86 + 0.14 * Math.sqrt(rnd()));
    const x = side * 0.5 + dx * 0.95 * g * 0.62, y = dy * (0.82 + (dy > 0 ? 0.08 : -0.05)) * g + 0.15, z = dz * 1.28 * g;
    if (Math.abs(x) < 0.06) continue;
    const r = z > 0.38 ? "frontal" : (z > 0.1 && y > 0.05) ? "motor" : z < -0.72 ? "occipital" : (y < -0.12 && Math.abs(x) > 0.6) ? "temporal" : "parietal";
    P.push([x, y, z, RI(r), 0.75 + rnd() * 0.6]);

  for (let i = 0; i < 650; i++) { const [dx, dy, dz] = sphereDir(); const g = 1 + 0.07 * Math.sin(24 * dy); P.push([dx * 0.78 * g, -0.62 + dy * 0.33 * g, -0.82 + dz * 0.42 * g, RI("cerebellum"), 0.75 + rnd() * 0.6]); }

  const N = P.length, sx = new Float32Array(N), sy = new Float32Array(N), sz = new Float32Array(N), idx = Array.from({ length: N }, (_, i) => i);
  const rgb = ORDER.map(k => { const h = CLASSES[k].color; return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }).concat([[120, 112, 170]]);

  let rotY = 0.6, rotX = 0.12, velY = 0, dragging = false, moved = 0, lastX = 0, lastY = 0, idle = 0, hover = null;
  let W = 0, H = 0, dpr = 1, scale = 1, cx = 0, cy = 0;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  function project() {
    const cY = Math.cos(rotY), sY = Math.sin(rotY), cX = Math.cos(rotX), sX = Math.sin(rotX);
    for (let i = 0; i < N; i++) {
      const [x, y0, z] = P[i], y = y0 - 0.15;
      const x1 = x * cY + z * sY, z1 = -x * sY + z * cY;
      const y2 = y * cX - z1 * sX, z2 = y * sX + z1 * cX;

    }

    let best = null, bz = -9;

    return best === null || P[best][3] === NONE ? null : ORDER[P[best][3]];

  resize();

  let t = 0;

    if (!dragging) { velY *= 0.94; rotY += velY; if (idle > 2.5 && !reduce) rotY += 0.0035; }
    project();
    idx.sort((a, b) => sz[a] - sz[b]);
    const sel = ORDER.indexOf(selected), hv = hover ? ORDER.indexOf(hover) : -1;
    glow.forEach((_, i) => { const target = i === NONE ? 0.22 : i === sel ? 1.4 : i === hv ? 0.85 : hot[i] && !reduce ? 0.45 + 0.35 * (0.5 + 0.5 * Math.sin(t * 4)) : 0.32; glow[i] += (target - glow[i]) * 0.15; });
    const pulse = reduce ? 1 : 1 + 0.12 * Math.sin(t * 3);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    const base = Math.max(1.4, scale * 0.02);

      const c = rgb[r], on = r === sel;
      const m = glow[r] * (0.45 + 0.55 * depth);
      const mix = v => m <= 1 ? bg[0] * 0 + v * m : v + (255 - v) * (m - 1);
      ctx.fillStyle = m <= 1
        ? `rgb(${bg[0] + (c[0] - bg[0]) * m | 0},${bg[1] + (c[1] - bg[1]) * m | 0},${bg[2] + (c[2] - bg[2]) * m | 0})`
        : `rgb(${mix(c[0]) | 0},${mix(c[1]) | 0},${mix(c[2]) | 0})`;

  }
  frame();
})();
